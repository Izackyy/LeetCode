name: Force stats commit message

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  force-stats-msg:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commits
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reword trailing "Add * to topics." commit back to its stats message
        run: |
          python3 << 'PYEOF'
          import subprocess, re

          def run(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True)

          def git(cmd):
              r = run(f"git {cmd}")
              if r.returncode != 0:
                  print(f"git {cmd} failed: {r.stderr}")
              return r

          # LeetHub and our own bot workflows can leave a folder's *current*
          # last commit as something other than its real Time/Space stats
          # line (a "Create readme"/"Add X to topics." replay, a stale -C
          # HEAD reuse from a race with a concurrent workflow run, etc). This
          # is a general safety net: whenever HEAD is a normal single-problem
          # commit (touches one folder, <=2 files - never the old 60-70 file
          # bulk-rename commits, which are intentionally left alone) and its
          # own message isn't the stats line, but a real stats commit exists
          # earlier in that folder's history, reword HEAD to reuse it (-C).
          STATS_RE = re.compile(r'^Time: .+ - (LeetHub|LeetSync)$')
          MAX_FILES = 3

          def head_info():
              sha = git('rev-parse HEAD').stdout.strip()
              subject = git('log -1 --format=%s HEAD').stdout.strip()
              files = git('diff-tree --no-commit-id --name-only -r HEAD').stdout.strip().splitlines()
              return sha, subject, files

          fixed = False
          for attempt in range(5):
              git('fetch origin main')
              git('reset --hard origin/main')
              sha, subject, files = head_info()

              if STATS_RE.match(subject):
                  print("HEAD already shows its stats message, nothing to do.")
                  break

              if not files or len(files) > MAX_FILES:
                  print("HEAD is not a single-problem commit, skipping.")
                  break

              readme = next((f for f in files if f.endswith("README.md")), None)
              if not readme:
                  print("HEAD touched no README.md, skipping.")
                  break
              folder = readme.rsplit('/', 1)[0]

              log = git(f'log --format=%H%x09%s HEAD^ -- "{folder}"').stdout.strip().splitlines()
              stats_sha = None
              for line in log:
                  h, _, msg = line.partition('\t')
                  if STATS_RE.match(msg):
                      stats_sha = h
                      break

              if not stats_sha:
                  print(f"No stats commit found for {folder}, skipping.")
                  break

              if stats_sha == sha:
                  print("HEAD is already the stats commit, nothing to do.")
                  break

              git('config user.name "github-actions[bot]"')
              git('config user.email "github-actions[bot]@users.noreply.github.com"')
              git(f'commit --amend -C {stats_sha}')

              if git(f'push --force-with-lease=main:{sha} origin main').returncode == 0:
                  print(f"Reworded HEAD commit for {folder} back to its stats message.")
                  fixed = True
                  break
              print(f"Push race detected, retrying (attempt {attempt + 1})...")

          if not fixed and attempt == 4:
              print("Failed to force stats message after retries.")
          PYEOF
