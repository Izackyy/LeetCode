name: Organize stray C++ files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commits
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Move stray C++ files into C++/
        run: |
          python3 << 'PYEOF'
          import subprocess, os

          def run(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True)

          def git(cmd):
              r = run(f"git {cmd}")
              if r.returncode != 0:
                  print(f"git {cmd} failed: {r.stderr}")
              return r

          changed = False

          result = run("find . -maxdepth 2 -name '*.cpp' -not -path './C++/*' -not -path './.github/*'")
          for file in result.stdout.strip().split('\n'):
              if not file:
                  continue
              d = os.path.dirname(file)
              fname = os.path.basename(file)
              if d == ".":
                  os.makedirs("C++", exist_ok=True)
                  git(f'mv "{file}" "C++/{fname}"')
                  changed = True
              else:
                  foldername = os.path.basename(d)
                  os.makedirs(f"C++/{foldername}", exist_ok=True)
                  for f in os.listdir(d):
                      git(f'mv "{d}/{f}" "C++/{foldername}/{f}"')
                  changed = True

          if changed:
              git('config user.name "github-actions[bot]"')
              git('config user.email "github-actions[bot]@users.noreply.github.com"')
              # Reuse the triggering commit's message and authorship (-C HEAD)
              # instead of writing our own — a distinct "chore: move stray
              # C++ files..." commit becomes the file's "last commit" in
              # GitHub's UI and buries the original commit's message.
              git('commit -C HEAD')
              git('push')
              print("Changes committed and pushed.")
          else:
              print("No changes needed.")
          PYEOF
