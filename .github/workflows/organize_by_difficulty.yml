name: Organize solutions by difficulty

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  organize-by-difficulty:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commits
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Move freshly-pushed solutions into <Language>/<Difficulty>/<slug>/
        run: |
          python3 << 'PYEOF'
          import subprocess, os, json, requests, time, re

          CACHE_PATH = ".github/leetcode_stats_cache.json"
          LANGUAGES = ["C++", "Python", "MySQL", "Daily"]
          KNOWN_DIFFICULTIES = {"Easy", "Medium", "Hard"}

          def run(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True)

          def git(cmd):
              r = run(f"git {cmd}")
              if r.returncode != 0:
                  print(f"git {cmd} failed: {r.stderr}")
              return r

          def get_slug_from_folder(folder_name):
              return re.sub(r'^\d+-', '', folder_name)

          def fetch_difficulty(slug):
              """LeetHub doesn't know about our Difficulty/ nesting, so every
              fresh submission lands back at the flat <Language>/<slug>/ path.
              Same lookup as update_readme_stats.yml: cache first, then the
              LeetCode GraphQL API."""
              url = "https://leetcode.com/graphql"
              query = """
              query getQuestionDetail($titleSlug: String!) {
                question(titleSlug: $titleSlug) {
                  difficulty
                  topicTags { name }
                }
              }
              """
              try:
                  resp = requests.post(url, json={
                      "query": query,
                      "variables": {"titleSlug": slug}
                  }, headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0"
                  }, timeout=10)
                  data = resp.json()
                  question = data.get("data", {}).get("question")
                  if question and question.get("difficulty"):
                      topics = question.get("topicTags")
                      return question["difficulty"], [t["name"] for t in topics] if topics else None
              except Exception as e:
                  print(f"Failed to fetch difficulty for '{slug}': {e}")
              return None, None

          def load_cache():
              if os.path.exists(CACHE_PATH):
                  with open(CACHE_PATH) as f:
                      return json.load(f)
              return {}

          def save_cache(cache):
              os.makedirs(os.path.dirname(CACHE_PATH), exist_ok=True)
              with open(CACHE_PATH, 'w') as f:
                  json.dump(cache, f, indent=2, sort_keys=True)

          cache = load_cache()
          cache_changed = False
          changed = False

          for lang in LANGUAGES:
              if not os.path.isdir(lang):
                  continue
              for folder in sorted(os.listdir(lang)):
                  # Only a flat <lang>/<slug> folder needs moving. A folder
                  # named Easy/Medium/Hard is already the difficulty level,
                  # and anything nested under one is already organized.
                  if folder in KNOWN_DIFFICULTIES:
                      continue
                  src = os.path.join(lang, folder)
                  if not os.path.isdir(src):
                      continue

                  slug = get_slug_from_folder(folder)
                  difficulty = cache.get(slug, {}).get("difficulty")
                  if not difficulty:
                      print(f"Fetching difficulty for: {slug}")
                      difficulty, topics = fetch_difficulty(slug)
                      if difficulty:
                          cache[slug] = {"difficulty": difficulty, "topics": topics}
                          cache_changed = True
                      time.sleep(1)

                  if not difficulty:
                      print(f"Could not determine difficulty for {src}, leaving in place")
                      continue

                  dest_dir = os.path.join(lang, difficulty)
                  dest = os.path.join(dest_dir, folder)
                  os.makedirs(dest_dir, exist_ok=True)
                  git(f'mv "{src}" "{dest}"')
                  print(f"Moved {src} -> {dest}")
                  changed = True

          if cache_changed:
              save_cache(cache)
              git(f'add "{CACHE_PATH}"')

          if changed or cache_changed:
              git('config user.name "github-actions[bot]"')
              git('config user.email "github-actions[bot]@users.noreply.github.com"')
              # Reuse the triggering commit's message and authorship (-C HEAD),
              # consistent with the other bot workflows, instead of writing our
              # own generic message that would bury LeetHub's real commit.
              git('commit -C HEAD')

              # Other workflows may push to main concurrently; rebase and retry.
              # This workflow moves files, so it's the most collision-prone of
              # the bunch.
              pushed = False
              for attempt in range(5):
                  if git('push').returncode == 0:
                      pushed = True
                      break
                  print(f"Push failed, retrying with rebase (attempt {attempt + 1})...")
                  git('pull --rebase origin main')
              if not pushed:
                  print("Failed to push after retries.")
              else:
                  print("Changes committed and pushed.")
          else:
              print("No changes needed.")
          PYEOF
