name: Fix README difficulty badge format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-difficulty-badge:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commits
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert LeetHub-style difficulty tags to LeetSync-style badges
        run: |
          python3 << 'PYEOF'
          import subprocess, os, re

          def run(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True)

          def git(cmd):
              r = run(f"git {cmd}")
              if r.returncode != 0:
                  print(f"git {cmd} failed: {r.stderr}")
              return r

          COLORS = {"Easy": "brightgreen", "Medium": "orange", "Hard": "red"}

          # Matches LeetHub's old "</h2><h3>Easy</h3><hr>" style (whitespace-tolerant)
          PATTERN = re.compile(
              r'</h2>\s*<h3[^>]*>\s*(Easy|Medium|Hard)\s*</h3>\s*<hr>',
              re.IGNORECASE
          )

          def to_badge(match):
              difficulty = match.group(1).capitalize()
              color = COLORS.get(difficulty, "grey")
              badge = f"<img src='https://img.shields.io/badge/Difficulty-{difficulty}-{color}' alt='Difficulty: {difficulty}' />"
              return f"</h2> {badge}<hr>"

          git('config user.name "github-actions[bot]"')
          git('config user.email "github-actions[bot]@users.noreply.github.com"')

          # LeetHub often fires several follow-up commits (stats, then topics)
          # right after the initial "Create readme" push. If we -C HEAD off
          # the commit that triggered this run, by the time we actually push
          # those later commits may already be on origin/main, and our stale
          # reused message ends up burying them as the folder's "last commit".
          # So re-sync to the true tip immediately before every commit/push
          # attempt, not just once at checkout.
          pushed = False
          for attempt in range(5):
              git('fetch origin main')
              git('reset --hard origin/main')

              changed_files = []
              for dirpath, dirnames, filenames in os.walk("."):
                  dirnames[:] = [d for d in dirnames if d not in (".git", ".github") and not d.startswith(".")]
                  if dirpath == ".":
                      # Skip the repo-root README.md (stats file, not a problem README)
                      continue
                  if "README.md" not in filenames:
                      continue

                  path = os.path.join(dirpath, "README.md")
                  with open(path, encoding="utf-8") as f:
                      content = f.read()

                  new_content = PATTERN.sub(to_badge, content)
                  if new_content != content:
                      with open(path, 'w', encoding="utf-8") as f:
                          f.write(new_content)
                      git(f'add "{path}"')
                      changed_files.append(path)

              if not changed_files:
                  print("No changes needed.")
                  pushed = True
                  break

              print(f"Fixed difficulty badge in {len(changed_files)} file(s):")
              for p in changed_files:
                  print(f"  {p}")

              # Reuse the current (just-synced) tip commit's message and
              # authorship instead of writing our own — a distinct
              # "chore: normalize..." commit becomes the file's "last commit"
              # in GitHub's UI and buries LeetHub's own message.
              git('commit -C HEAD')

              if git('push').returncode == 0:
                  pushed = True
                  print("Changes committed and pushed.")
                  break
              print(f"Push failed, retrying (attempt {attempt + 1})...")

          if not pushed:
              print("Failed to push after retries.")
          PYEOF
